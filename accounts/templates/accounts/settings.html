{% extends "accounts/base.html" %}
{% load static %}

{% block title %}Account settings{% endblock %}

{% block content %}
  <h1>Account settings</h1>
  <p>Choose how you introduce yourself. All profile fields are optional.</p>
  <img id="profile-photo-preview" class="profile-photo"{% if form.initial.profile_photo %} src="{{ form.initial.profile_photo.url }}"{% else %} hidden{% endif %} alt="Your current profile photo" width="96" height="96">
  <p id="profile-photo-preview-status" class="helptext" role="status" hidden></p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form }}
    <div class="actions">
      <button type="submit" class="button primary">Save changes</button>
      <a class="button" href="{% url 'landing' %}">Cancel</a>
    </div>
  </form>
  <script src="{% static 'accounts/profile-photo-preview.js' %}" defer></script>
{% endblock %}
