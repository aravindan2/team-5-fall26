<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <style>
        .login-container {
            max-width: 720px;
            margin: 5rem auto;
            padding: 2.2rem;
        }
        .error-text {
            color: #b91c1c;
        }
        .link-group {
            margin-top: 1.8rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        button {
            margin-top: 1rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
        }
        .loading {
            display: none;
            margin-top: 0.6rem;
            color: #444;
            align-items: center;
            gap: 0.5rem;
        }
        .login-container.loading-state .loading {
            display: flex;
        }
        /* Spinner animation */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ddd;
            border-top: 2px solid #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Countdown text style */
        #countdown {
            color: #b91c1c;
            font-weight: bold;
            margin: 0.8rem 0;
        }
        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.8rem;
        }
        .form-row label {
            width: 220px;
        }
        .form-row input {
            flex: 1;
            height: 2rem;
        }
    </style>
</head>
<body>
<div class="login-container" id="loginBox">
    <h2>Log In to Your Account</h2>
    {% if messages %}
        {% for message in messages %}
            <p class="error-text">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <!-- Countdown display area, hidden if not locked -->
    <div id="countdown"></div>

    <form method="POST" id="loginForm">
        {% csrf_token %}
        <div class="form-row">
            <label for="id_username">Username or Email:</label>
            <input type="text" name="username" id="id_username" required>
        </div>
        <div class="form-row">
            <label for="id_password">Password:</label>
            <input type="password" name="password" id="id_password" required>
        </div>
        <button type="submit" id="submitBtn">Log In</button>
        <div class="loading">
            <span class="spinner"></span>
            <span>Logging in...</span>
        </div>
    </form>

    <div class="link-group">
        <a href="{% url 'password_reset' %}">Forgot Password?</a>
        <a href="{% url 'register' %}">Create New Account</a>
    </div>
</div>

<script>
// Get lock expiry timestamp passed from backend
const lockExpiry = {{ lock_expiry|default:"null" }};
const countdownElement = document.getElementById("countdown");
const loginForm = document.getElementById("loginForm");
const submitButton = document.getElementById("submitBtn");
const loginBox = document.getElementById("loginBox");

/**
 * Format remaining seconds into MM:SS
 * @param {number} seconds - remaining time in seconds
 * @returns {string} formatted time string
 */
function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    const mStr = String(mins).padStart(2, '0');
    const sStr = String(secs).padStart(2, '0');
    return `${mStr}:${sStr}`;
}

/**
 * Update countdown timer every second
 * When timer hits 0, unlock form and hide countdown
 */
function startCountdown() {
    if (!lockExpiry) return;

    function tick() {
        const now = Date.now() / 1000; // current Unix timestamp in seconds
        const remaining = lockExpiry - now;

        if (remaining <= 0) {
            countdownElement.textContent = "";
            submitButton.disabled = false;
            return;
        }
        // Disable form submit while locked
        submitButton.disabled = true;
        countdownElement.textContent = `Please wait ${formatTime(remaining)} before retrying.`;
        setTimeout(tick, 1000);
    }
    tick();
}

// Login loading animation trigger
loginForm.addEventListener("submit", () => {
    loginBox.classList.add("loading-state");
});

// Start countdown on page load
window.onload = startCountdown;
</script>
</body>
</html>
